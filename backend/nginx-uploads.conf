# ============================================================
# Nginx config snippet for vrushahi/vrushahi image caching
# Paste inside your existing server {} block
# ============================================================

server {
    listen 80;
    server_name api.yourdomain.com;   # ← change to your backend domain/IP

    # ─── Static uploaded images ──────────────────────────────
    # Serve /uploads/* directly from disk with aggressive caching
    location /uploads/ {
        alias /root/vrushahi_Quick_commerce/backend/uploads/;   # ← change to your backend path

        # 1 year browser + CDN cache — safe because filenames are unique
        # (timestamp + random hex in filename, so cache-busting is automatic)
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;

        # Enable gzip for SVGs / tiny files (WebP/JPEG already compressed)
        gzip_static on;

        # Allow cross-origin image requests from your frontend domain
        add_header Access-Control-Allow-Origin "https://www.yourdomain.com";

        expires 1y;
        access_log off;  # Don't log static file hits (reduces I/O)
    }

    # ─── API requests → Node.js backend ──────────────────────
    location /api/ {
        proxy_pass http://localhost:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Socket.io ────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://localhost:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

# ============================================================
# Backup Strategy Recommendations
# ============================================================
#
# Option A — Daily rsync to another server / S3:
#   Add to crontab (crontab -e):
#   0 2 * * * rsync -avz /root/vrushahi_Quick_commerce/backend/uploads/ user@backup-server:/backups/uploads/
#
# Option B — VPS snapshot:
#   Most VPS providers (DigitalOcean, Hostinger, Hetzner) offer
#   scheduled snapshots. Enable weekly snapshots in your VPS dashboard.
#
# Option C — Rclone to S3/Backblaze B2 (free 10GB):
#   0 3 * * * rclone sync /root/vrushahi_Quick_commerce/backend/uploads/ b2:your-bucket/uploads/
#
# ============================================================
